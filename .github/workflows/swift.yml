name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Mac build, core tests and simulation
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build
    - name: Run tests
      run: swift test
    - name: Run Battle Simulator
      run: swift run RiftPatrolSim 20

  ios:
    name: iPhone and iPad simulator build
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Show Xcode version
      run: xcodebuild -version
    - name: Build iOS app without signing
      shell: bash
      run: |
        set -o pipefail
        xcodebuild \
          -project RiftPatrol.xcodeproj \
          -scheme RiftPatrol-iOS \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath "$RUNNER_TEMP/RiftPatrolBuild" \
          CODE_SIGNING_ALLOWED=NO \
          build 2>&1 | tee "$RUNNER_TEMP/rift-ios-build.log"
    - name: Upload iOS build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-log
        path: ${{ runner.temp }}/rift-ios-build.log
        if-no-files-found: ignore
